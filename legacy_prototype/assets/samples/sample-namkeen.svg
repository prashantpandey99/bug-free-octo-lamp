<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <linearGradient id="namkeenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Package Background -->
  <rect width="700" height="900" rx="24" fill="url(#namkeenBg)"/>
  <rect x="25" y="25" width="650" height="850" rx="16" fill="none" stroke="#FDBA74" stroke-width="2"/>

  <!-- Brand Header -->
  <g transform="translate(350, 90)" text-anchor="middle">
    <text y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#FEF08A" letter-spacing="2">DESI TASTE</text>
    <text y="70" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="3">SPICY MASALA CHANA CRUNCH</text>
  </g>

  <!-- Principal Display Panel (PDP) Box -->
  <rect x="50" y="190" width="600" height="660" rx="14" fill="#1C1917" fill-opacity="0.95" stroke="#78350F" stroke-width="1.5"/>

  <!-- Section: Generic Name -->
  <g transform="translate(75, 230)">
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#A8A29E">PRODUCT DESCRIPTION:</text>
    <text y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#FDBA74">Roasted Bengal Gram Snack with Spices</text>
  </g>

  <!-- Section: Net Quantity (VIOLATION: 'gms' instead of 'g') -->
  <g transform="translate(75, 305)">
    <rect x="-10" y="-12" width="270" height="85" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="2"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">NET QUANTITY (FLAGGED):</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="32" font-weight="800" fill="#F87171">200 gms</text>
    <text y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" fill="#FECACA">⚠ VIOLATION: Non-standard unit 'gms' (Rule 12)</text>
  </g>

  <!-- Section: MRP (VIOLATION: missing 'incl. of all taxes') -->
  <g transform="translate(365, 305)">
    <rect x="-10" y="-12" width="280" height="85" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="2"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">MAXIMUM RETAIL PRICE (FLAGGED):</text>
    <text y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="800" fill="#F87171">MRP Rs 45.00</text>
    <text y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" fill="#FECACA">⚠ VIOLATION: Missing "(incl. of all taxes)" (Rule 6(1)(e))</text>
  </g>

  <!-- Section: Dates & Batch -->
  <g transform="translate(75, 425)">
    <rect x="-10" y="-10" width="570" height="52" rx="6" fill="#292524"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#A8A29E">PACKING DATE &amp; BATCH:</text>
    <text y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#F5F5F4">Packed: 07/2026  |  Batch: DS-402</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#D6D3D1">Best before 4 months from packing</text>
  </g>

  <!-- Section: Manufacturer Details (VIOLATION: Incomplete address) -->
  <g transform="translate(75, 510)">
    <rect x="-10" y="-10" width="570" height="60" rx="6" fill="#450A0A" stroke="#DC2626" stroke-width="1.5"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">MANUFACTURED BY (FLAGGED):</text>
    <text y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Desi Snacks Foods, Jaipur, Rajasthan</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#F87171">⚠ VIOLATION: Incomplete address (Missing Plot No., Area, Pincode) (Rule 6(1)(a))</text>
  </g>

  <!-- Section: Consumer Care Details (VIOLATION: Missing email, address) -->
  <g transform="translate(75, 600)">
    <rect x="-10" y="-10" width="570" height="60" rx="6" fill="#450A0A" stroke="#DC2626" stroke-width="1.5"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">CUSTOMER SUPPORT (FLAGGED):</text>
    <text y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Customer queries: Call +91 9876543210</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#F87171">⚠ VIOLATION: Missing consumer care email, postal address &amp; officer designation (Rule 6(1)(n))</text>
  </g>

  <!-- Section: Unit Sale Price missing (for pack) -->
  <g transform="translate(350, 700)" text-anchor="middle">
    <rect x="-170" y="-12" width="340" height="26" rx="13" fill="#DC2626" fill-opacity="0.25" stroke="#EF4444" stroke-width="1.5"/>
    <text y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#F87171">✕ 4 STATUTORY VIOLATIONS DETECTED (SECTION 36)</text>
  </g>

  <!-- Simulated Barcode -->
  <g transform="translate(350, 770)" text-anchor="middle">
    <rect x="-120" y="-15" width="240" height="40" fill="#FFFFFF" rx="4"/>
    <text y="10" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#000000" letter-spacing="4">||| | || |||| || | |</text>
    <text y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="600" fill="#334155">8909876543210</text>
  </g>
</svg>
