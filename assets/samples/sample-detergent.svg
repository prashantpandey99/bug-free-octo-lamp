<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <linearGradient id="detBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <rect width="700" height="900" rx="24" fill="url(#detBg)"/>
  <rect x="25" y="25" width="650" height="850" rx="16" fill="none" stroke="#93C5FD" stroke-width="2"/>

  <!-- Brand Header -->
  <g transform="translate(350, 85)" text-anchor="middle">
    <text y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#FEF08A" letter-spacing="2">ULTRA BRIGHT</text>
    <text y="70" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="3">ADVANCED OXY-POWER DETERGENT</text>
    <rect x="-140" y="82" width="280" height="24" rx="12" fill="#DC2626"/>
    <text y="98" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">SUPER SAVER JUMBO MEGA PACK</text>
  </g>

  <!-- Principal Display Panel (PDP) Box (Large Area ~ 520 sq cm) -->
  <rect x="50" y="220" width="600" height="630" rx="14" fill="#0F172A" fill-opacity="0.95" stroke="#3B82F6" stroke-width="1.5"/>

  <!-- Generic Name -->
  <g transform="translate(75, 255)">
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">GENERIC / COMMON COMMODITY NAME:</text>
    <text y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#60A5FA">Synthetic Detergent Powder for Fabric Wash</text>
  </g>

  <!-- Net Quantity (VIOLATION: Font size only 1.8mm equivalent on large PDP needing min 4.0mm) -->
  <g transform="translate(75, 325)">
    <rect x="-10" y="-12" width="270" height="95" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="2"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">NET QUANTITY (VIOLATION):</text>
    <!-- Intentionally rendered with small font relative to package size -->
    <text y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#F87171">Net Wt: 3.0 kg</text>
    <text y="54" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" fill="#FECACA">⚠ VIOLATION: Font height (1.8mm) below</text>
    <text y="70" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" fill="#FECACA">prescribed 4.0mm for &gt;1kg pack (Schedule II)</text>
  </g>

  <!-- MRP & Unit Sale Price (VIOLATION: Missing Unit Sale Price) -->
  <g transform="translate(365, 325)">
    <rect x="-10" y="-12" width="280" height="95" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="2"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">MAXIMUM RETAIL PRICE (VIOLATION):</text>
    <text y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="800" fill="#FDE047">MRP Rs. 420.00</text>
    <text y="50" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#FCA5A5">(inclusive of all taxes)</text>
    <text y="70" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" fill="#FECACA">⚠ VIOLATION: Missing Unit Sale Price (₹/kg)</text>
  </g>

  <!-- Dates -->
  <g transform="translate(75, 450)">
    <rect x="-10" y="-10" width="570" height="48" rx="6" fill="#1E293B"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">MONTH &amp; YEAR OF MANUFACTURING:</text>
    <text y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Mfg. 06/2026  |  Batch: UBD-609  |  Best Before 24 Months</text>
  </g>

  <!-- Manufacturer -->
  <g transform="translate(75, 525)">
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">MANUFACTURED &amp; PACKED BY:</text>
    <text y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">CleanHome Consumer Products Pvt. Ltd.</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">Plot No. 12, Phase-2, GIDC Industrial Estate, Vatva, Ahmedabad, Gujarat - 382445, India</text>
    <text y="54" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Country of Origin: India</text>
  </g>

  <!-- Consumer Care -->
  <g transform="translate(75, 620)">
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">CONSUMER CARE DETAILS:</text>
    <text y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Customer Care Officer, Address as above</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">Toll Free: 1800-108-9999  |  Email: contact@cleanhomeindia.com</text>
  </g>

  <!-- Banner -->
  <g transform="translate(350, 700)" text-anchor="middle">
    <rect x="-180" y="-12" width="360" height="26" rx="13" fill="#DC2626" fill-opacity="0.25" stroke="#EF4444" stroke-width="1.5"/>
    <text y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#F87171">✕ 2 NON-COMPLIANCES: FONT HEIGHT &amp; UNIT PRICE</text>
  </g>

  <!-- Barcode -->
  <g transform="translate(350, 770)" text-anchor="middle">
    <rect x="-120" y="-15" width="240" height="40" fill="#FFFFFF" rx="4"/>
    <text y="10" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#000000" letter-spacing="4">|| ||| | ||| |||| | |</text>
    <text y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="600" fill="#334155">8905544332211</text>
  </g>
</svg>
