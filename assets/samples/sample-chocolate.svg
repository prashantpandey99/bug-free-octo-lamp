<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <linearGradient id="chocBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261208"/>
      <stop offset="50%" stop-color="#3D1C06"/>
      <stop offset="100%" stop-color="#140A04"/>
    </linearGradient>
  </defs>

  <rect width="700" height="900" rx="24" fill="url(#chocBg)"/>
  <rect x="25" y="25" width="650" height="850" rx="16" fill="none" stroke="#D97706" stroke-width="2"/>

  <!-- Brand Header -->
  <g transform="translate(350, 90)" text-anchor="middle">
    <text y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="32" font-weight="900" fill="#FDE68A" letter-spacing="3">ALPINE NOIR</text>
    <text y="70" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="#D1D5DB" letter-spacing="4">72% ARTISAN DARK CHOCOLATE</text>
  </g>

  <!-- Principal Display Panel (PDP) Box -->
  <rect x="50" y="190" width="600" height="660" rx="14" fill="#0F0804" fill-opacity="0.95" stroke="#92400E" stroke-width="1.5"/>

  <!-- Section: Generic Name -->
  <g transform="translate(75, 230)">
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#A8A29E">GENERIC NAME:</text>
    <text y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#FDE68A">Dark Chocolate Bar (Cocoa Solids 72% min)</text>
  </g>

  <!-- Section: Net Quantity -->
  <g transform="translate(75, 305)">
    <rect x="-10" y="-12" width="270" height="85" rx="8" fill="#1C1917" stroke="#22C55E" stroke-width="1.5"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#86EFAC">NET QUANTITY:</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">100 g</text>
    <text y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#86EFAC">✓ Standard Unit 'g' | Font Height OK</text>
  </g>

  <!-- Section: MRP -->
  <g transform="translate(365, 305)">
    <rect x="-10" y="-12" width="280" height="85" rx="8" fill="#1C1917" stroke="#22C55E" stroke-width="1.5"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#86EFAC">MAXIMUM RETAIL PRICE:</text>
    <text y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="800" fill="#FDE047">MRP ₹ 240.00</text>
    <text y="54" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#86EFAC">(incl. of all taxes)</text>
    <text y="68" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">USP: ₹ 2.40 / g</text>
  </g>

  <!-- Section: Dates & Expiry -->
  <g transform="translate(75, 425)">
    <rect x="-10" y="-10" width="570" height="52" rx="6" fill="#1C1917"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#A8A29E">MANUFACTURED DATE &amp; EXPIRY:</text>
    <text y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#F5F5F4">Mfg Date: 05/2026  |  Best Before: 05/2027</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#A8A29E">Lot: AL-9821</text>
  </g>

  <!-- Section: Foreign Manufacturer (No Indian Importer listed) -->
  <g transform="translate(75, 505)">
    <rect x="-10" y="-10" width="570" height="75" rx="6" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">OVERSEAS MANUFACTURER (IMPORTED COMMODITY):</text>
    <text y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Manufactured by: Alpine Chocolatier SA, Rue de Berne 12, Geneva, Switzerland</text>
    <text y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#F87171">⚠ VIOLATION 1: Missing Name &amp; Address of Importer in India (Rule 6(1)(a))</text>
    <text y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#F87171">⚠ VIOLATION 2: Missing 'Country of Origin' declaration (Rule 6(10))</text>
  </g>

  <!-- Section: Consumer Care Details (Missing) -->
  <g transform="translate(75, 605)">
    <rect x="-10" y="-10" width="570" height="60" rx="6" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">CONSUMER COMPLAINTS (FLAGGED):</text>
    <text y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Contact: info@alpinechoc.ch</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#F87171">⚠ VIOLATION 3: No Indian domestic consumer grievance office / toll-free contact</text>
  </g>

  <!-- Flag Banner -->
  <g transform="translate(350, 700)" text-anchor="middle">
    <rect x="-170" y="-12" width="340" height="26" rx="13" fill="#DC2626" fill-opacity="0.25" stroke="#EF4444" stroke-width="1.5"/>
    <text y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#F87171">✕ 3 STATUTORY IMPORT VIOLATIONS DETECTED</text>
  </g>

  <!-- Barcode -->
  <g transform="translate(350, 770)" text-anchor="middle">
    <rect x="-120" y="-15" width="240" height="40" fill="#FFFFFF" rx="4"/>
    <text y="10" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#000000" letter-spacing="4">|||| || ||| || |||||</text>
    <text y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="600" fill="#334155">7612345678901</text>
  </g>
</svg>
