<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <linearGradient id="serumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <rect width="700" height="900" rx="24" fill="url(#serumBg)"/>
  <rect x="25" y="25" width="650" height="850" rx="16" fill="none" stroke="#DDD6FE" stroke-width="2"/>

  <!-- Brand Header -->
  <g transform="translate(350, 90)" text-anchor="middle">
    <text y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="30" font-weight="900" fill="#FDF4FF" letter-spacing="3">AURA BOTANICS</text>
    <text y="70" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#E9D5FF" letter-spacing="3">VITAMIN C GLOW RADIANCE FACE SERUM</text>
  </g>

  <!-- Principal Display Panel (PDP) Box -->
  <rect x="50" y="190" width="600" height="660" rx="14" fill="#180B2E" fill-opacity="0.95" stroke="#6D28D9" stroke-width="1.5"/>

  <!-- Generic Name -->
  <g transform="translate(75, 230)">
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#C4B5FD">GENERIC NAME:</text>
    <text y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#FAF5FF">Cosmetic Facial Serum (For External Use Only)</text>
  </g>

  <!-- Net Quantity -->
  <g transform="translate(75, 305)">
    <rect x="-10" y="-12" width="270" height="85" rx="8" fill="#2E1065" stroke="#A855F7" stroke-width="1.5"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#D8B4FE">NET QUANTITY:</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">30 ml</text>
    <text y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#C084FC">✓ Standard Volume Unit 'ml'</text>
  </g>

  <!-- MRP -->
  <g transform="translate(365, 305)">
    <rect x="-10" y="-12" width="280" height="85" rx="8" fill="#2E1065" stroke="#A855F7" stroke-width="1.5"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#D8B4FE">MAXIMUM RETAIL PRICE:</text>
    <text y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="800" fill="#FDE047">MRP ₹ 599.00</text>
    <text y="54" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#D8B4FE">(incl. of all taxes)</text>
    <text y="68" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#E9D5FF">USP: ₹ 19.97 / ml</text>
  </g>

  <!-- Date (VIOLATION: Incomplete date format "AUG" without Year) -->
  <g transform="translate(75, 425)">
    <rect x="-10" y="-10" width="570" height="56" rx="6" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">MONTH &amp; YEAR OF MANUFACTURING (FLAGGED):</text>
    <text y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Mfg Date: AUG  |  Batch: AB-90</text>
    <text y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#F87171">⚠ VIOLATION: Missing 4-digit or 2-digit Year of Manufacture (Rule 6(1)(d))</text>
  </g>

  <!-- Manufacturer -->
  <g transform="translate(75, 515)">
    <rect x="-10" y="-10" width="570" height="52" rx="6" fill="#2E1065"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#C4B5FD">MANUFACTURED BY:</text>
    <text y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#FAF5FF">Aura Naturals Cosmeceuticals Pvt. Ltd., Selaqui Industrial Area, Dehradun, UK - 248011</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#FDE68A">Country of Origin: India  |  Mfg Lic No: COS/UK/2023/12</text>
  </g>

  <!-- Consumer Care (VIOLATION: Missing Email) -->
  <g transform="translate(75, 600)">
    <rect x="-10" y="-10" width="570" height="60" rx="6" fill="#450A0A" stroke="#EF4444" stroke-width="1.5"/>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">CONSUMER FEEDBACK (FLAGGED):</text>
    <text y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Contact Manager at: 0135-2448899</text>
    <text y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#F87171">⚠ VIOLATION: Missing mandatory consumer grievance Email address (Rule 6(1)(n))</text>
  </g>

  <!-- Banner -->
  <g transform="translate(350, 700)" text-anchor="middle">
    <rect x="-170" y="-12" width="340" height="26" rx="13" fill="#DC2626" fill-opacity="0.25" stroke="#EF4444" stroke-width="1.5"/>
    <text y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#F87171">✕ 2 STATUTORY DECLARATION VIOLATIONS</text>
  </g>

  <!-- Barcode -->
  <g transform="translate(350, 770)" text-anchor="middle">
    <rect x="-120" y="-15" width="240" height="40" fill="#FFFFFF" rx="4"/>
    <text y="10" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#000000" letter-spacing="4">|||| || ||| || |||||</text>
    <text y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="600" fill="#334155">8907766554433</text>
  </g>
</svg>
